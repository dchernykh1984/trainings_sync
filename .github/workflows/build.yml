name: build

# Reusable build. With an empty release_tag it runs a fast Linux x64 smoke
# build (used on pull requests). With a release_tag it builds the full platform
# matrix and uploads each portable artifact to that GitHub Release.
#
# It is called in the SAME run as release-please (see release-please.yml) so the
# assets actually attach: a release created by GITHUB_TOKEN does not, by design,
# trigger a separate `release: published` workflow.

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to attach assets to; empty => Linux-only smoke build, no upload."
        type: string
        default: ""
      # Build the whole matrix and upload nothing. The release pull request uses
      # this to prove every platform still builds while the tag does not exist
      # yet; every other pull request keeps the fast Linux-only smoke build.
      all_platforms:
        description: "Build every platform without uploading (release pull request)."
        type: boolean
        default: false

env:
  # File name: the artifacts and the frozen executable. Kept ASCII and
  # space-free so a download URL stays readable.
  APP_NAME: trainings-sync
  # Name of the .app bundle. macOS shows the bundle's *file name* in the dock
  # and the task switcher; CFBundleName and CFBundleDisplayName are ignored
  # for apps outside /Applications, even with LSHasLocalizedDisplayName and a
  # localized InfoPlist.strings (all three were tried). So the dock name and
  # the file name are one and the same setting, and this one stays space-free
  # because the bundle is a file users copy around.
  APP_BUNDLE_NAME: TrainingsSync
  # Reverse-DNS bundle id. macOS keys preferences, granted folder permissions
  # and LaunchServices registration off this, so every app needs its own.
  APP_BUNDLE_ID: io.github.dchernykh1984.trainings-sync

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          # Pin the oldest macOS image GitHub still runs: the frozen app then
          # starts on as many macOS versions as possible. Bump it when that
          # label retires - macos-14 was switched off on 2026-11-02, and a job
          # asking for a retired label is cancelled a second in, with no steps
          # and no error, so the release just ends up without its macOS asset.
          full='{"include":[{"os":"ubuntu-22.04","name":"linux-x86_64"},{"os":"ubuntu-24.04-arm","name":"linux-aarch64"},{"os":"windows-latest","name":"windows-x64"},{"os":"windows-11-arm","name":"windows-arm64"},{"os":"macos-15","name":"macos-arm64"}]}'
          smoke='{"include":[{"os":"ubuntu-22.04","name":"linux-x86_64"}]}'
          if [ -n "${{ inputs.release_tag }}" ] \
            || [ "${{ inputs.all_platforms }}" = "true" ]; then
            echo "matrix=$full" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$smoke" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: targets
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libxkbcommon0

      - name: Install dependencies
        run: uv sync

      - name: Build portable app
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # Pin PyInstaller so a future major release cannot break builds.
          pyi=(uv run --with "pyinstaller>=6,<7" pyinstaller)
          common=(--noconfirm --windowed --collect-submodules app)
          if [ "$RUNNER_OS" = "macOS" ]; then
            # --name sets the .app folder name, which is what the dock shows.
            # The zip around it keeps the artifact name, so download URLs are
            # unaffected.
            "${pyi[@]}" --name "$APP_BUNDLE_NAME" --icon app/app.icns \
              --osx-bundle-identifier "$APP_BUNDLE_ID" \
              "${common[@]}" app/gui/app.py
            # PyInstaller hardcodes CFBundleShortVersionString to 0.0.0 and
            # offers no flag for it, so stamp the plist by hand. On a release
            # the tag is authoritative; on a smoke build fall back to
            # pyproject.toml.
            version="${RELEASE_TAG#v}"
            if [ -z "$version" ]; then
              version=$(awk -F'"' '/^version *= *"/ {print $2; exit}' pyproject.toml)
            fi
            plist="dist/${APP_BUNDLE_NAME}.app/Contents/Info.plist"
            plutil -replace CFBundleShortVersionString -string "$version" "$plist"
            plutil -replace CFBundleVersion -string "$version" "$plist"
            # Editing the plist breaks the ad-hoc signature PyInstaller
            # applied ("plist or signature have been modified"), so reseal it.
            codesign --force --sign - "dist/${APP_BUNDLE_NAME}.app"
            ( cd dist && zip -r -y "${APP_NAME}-${{ matrix.name }}.zip" \
              "${APP_BUNDLE_NAME}.app" )
            echo "ASSET=dist/${APP_NAME}-${{ matrix.name }}.zip" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            "${pyi[@]}" --name "$APP_NAME" --onefile --icon app/app.ico \
              "${common[@]}" app/gui/app.py
            mv "dist/${APP_NAME}.exe" "dist/${APP_NAME}-${{ matrix.name }}.exe"
            echo "ASSET=dist/${APP_NAME}-${{ matrix.name }}.exe" >> "$GITHUB_ENV"
          else
            "${pyi[@]}" --name "$APP_NAME" --onefile "${common[@]}" app/gui/app.py
            mv "dist/${APP_NAME}" "dist/${APP_NAME}-${{ matrix.name }}"
            echo "ASSET=dist/${APP_NAME}-${{ matrix.name }}" >> "$GITHUB_ENV"
          fi

      - name: Verify the artifact was produced
        shell: bash
        run: test -s "$ASSET"

      - name: Smoke-launch the frozen app (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 20 "$ASSET"
          code=$?
          set -e
          # 124 = still running after the timeout (started fine); 0 = clean exit.
          if [ "$code" != "124" ] && [ "$code" != "0" ]; then
            echo "Frozen app failed to start (exit $code)"
            exit 1
          fi
          echo "Frozen app started cleanly."

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Attach to release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" "$ASSET" --clobber

  # A retired runner label is not a failure: GitHub accepts the job, cancels it
  # a second later with no steps, and marks the RUN cancelled - which notifies
  # nobody. The release is created before this matrix runs (it has to be: a
  # release made by GITHUB_TOKEN cannot trigger a separate workflow), so a dead
  # platform used to leave a published release quietly short of one download.
  # This job runs on a live label and says so out loud.
  verify:
    needs: [targets, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every platform must have built, and reached the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          MATRIX: ${{ needs.targets.outputs.matrix }}
          BUILDS: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "build matrix result: $BUILDS"
          bad=0
          if [ "$BUILDS" != "success" ]; then
            echo "::error::not every platform built (matrix result: $BUILDS)"
            echo "::error::a leg cancelled with no steps means its runner label is gone"
            bad=1
          fi
          if [ -n "$TAG" ]; then
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            echo "assets on $TAG:"
            printf '%s\n' "$assets" | sed 's/^/  /'
            for name in $(jq -r '.include[].name' <<<"$MATRIX"); do
              if ! printf '%s\n' "$assets" | grep -q -- "-$name"; then
                echo "::error::$TAG has no asset for $name"
                bad=1
              fi
            done
          fi
          if [ "$bad" != 0 ]; then
            exit 1
          fi
          echo "every platform in the matrix is accounted for"
